services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: greensteps
      POSTGRES_USER: greensteps
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
